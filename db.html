<script data-page-node-id="JAtQTjURdeHb1OglNwahOa" data-pnid-children="RLRTDb7XfMZb0hb2fW8iUu">
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,d){ localStorage.setItem(k, JSON.stringify(d)) }
};
let data = store.get('zaoduCoin') || {};
const todayKey = () => new Date().toISOString().slice(0,10);
if(!data.days) data.days = {};
if(data.coins===undefined) data.coins = 0;
if(data.streak===undefined) data.streak = 0;
let rewards = store.get('zaoduShop') || [
  {name:'看 20 分钟动画片', cost:50},
  {name:'一个冰淇淋', cost:100},
  {name:'周末去公园', cost:300},
];

let running=false, audioCtx=null, analyser=null, stream=null, looping=false;
let threshold=70, gainMul=1.5, goalSec=180, bonusCoins=30;
const setSaved = store.get('zaoduSet');
if(setSaved){ threshold=setSaved.threshold; gainMul=setSaved.gain; goalSec=setSaved.goal; bonusCoins=setSaved.bonus; }
$('threshold').value=threshold; $('gain').value=gainMul; $('goal').value=goalSec; $('bonus').value=bonusCoins;
$('thVal').textContent=threshold; $('gainVal').textContent=gainMul; $('goalVal').textContent=goalSec; $('bonusVal').textContent=bonusCoins;

const TITLES=[[0,'朗读学徒'],[50,'铜钱收集者'],[150,'白银钱袋'],[300,'黄金财主'],[600,'传说金库']];
function titleOf(n){ let t=TITLES[0],next=null; for(const it of TITLES){ if(n>=it[0]) t=it; else { next=it; break; } } return [t[1], next?next[0]-t[0]:0, next?next[1]:null]; }

function render(){
  const today=data.days[todayKey()]||{};
  $('cStreak').textContent=data.streak;
  $('cCoins').textContent=data.coins;
  $('cPeak').textContent=Math.round(today.peak||0);
  $('bank').textContent=`🪙 存钱罐：${data.coins}`;
  $('energyText').textContent = `${today.done?goalSec:Math.round(energySec)} / ${goalSec} 秒达标`;
  $('energyFill').style.width = (today.done?100:Math.min(100,energySec/goalSec*100))+'%';
  $('goalLine').textContent = `今日任务：累计达标朗读 ${goalText()} → 爆金币大奖！`;
  const [tn,need,nt]=titleOf(data.coins);
  $('title').textContent = '称号：'+tn + (nt?`（再攒 ${need} 枚升级「${nt}」）`:'（已是最高称号！）');
  const base = TITLES.filter(t=>t[1]===tn)[0][0];
  $('titleFill').style.width = nt? Math.min(100,(data.coins-base)/need*100)+'%' : '100%';
  const week=$('week'); week.innerHTML='';
  const names=['日','一','二','三','四','五','六'];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10), c=data.days[k];
    week.insertAdjacentHTML('beforeend',`<div class="day"><div class="d-coin">${c&&c.done?'🪙':'·'}</div>${i===0?'今天':'周'+names[d.getDay()]}</div>`);
  }
  $('shopBalance').textContent=data.coins;
}

/* ===== 音频 ===== */
async function start(){
  if(running) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('status').textContent='⚠️ 此浏览器不支持麦克风（微信内请点右上角用浏览器打开）'; return;
  }
  if(!window.isSecureContext && location.hostname!=='localhost'){
    $('status').textContent='⚠️ 手机需 HTTPS 才能用麦克风，请用电脑打开或部署到 https'; return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
  }catch(e){ $('status').textContent='❌ 请允许麦克风权限'; return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') await audioCtx.resume();  // iOS 解锁
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize=1024;
  src.connect(analyser);
  if(session.length && Date.now()-session[session.length-1].t>10000) session=[];  // 间隔太久算新的一次
  lastSample=0;
  running=true; $('startBtn').textContent='⏸ 暂停'; $('status').textContent='开始朗读吧，金币等你来爆！';
  if(!looping) loop();
}
function stop(){
  running=false; energyAcc=0; above=false;
  $('startBtn').textContent='🎤 继续朗读';
  $('status').textContent='⏸ 已暂停，点「继续朗读」接着来';
  ['ring1','ring2','ring3'].forEach((id,i)=>{
    const el=$(id); el.style.transform='scale(1)'; el.style.borderColor='#4facfe'; el.style.boxShadow='none';
  });
  if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream=null; }
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
  analyser=null;
}

$('startBtn').onclick = ()=> running ? stop() : start();

$('settingBtn').onclick = ()=> $('settings').classList.add('open');
$('shopBtn').onclick = ()=>{ renderShop(); $('shop').classList.add('open'); };
document.querySelectorAll('[data-close]').forEach(b=> b.onclick=()=> $(b.dataset.close).classList.remove('open'));
document.querySelectorAll('.panel').forEach(p=> p.addEventListener('click', e=>{ if(e.target===p) p.classList.remove('open'); }));

$('threshold').oninput = e=>{ threshold=+e.target.value; $('thVal').textContent=threshold; saveSet(); };
$('gain').oninput = e=>{ gainMul=+e.target.value; $('gainVal').textContent=gainMul; saveSet(); };
function goalText(){
  if(goalSec%60===0) return (goalSec/60)+' 分钟';
  return goalSec+' 秒';
}
function setGoal(sec, silent){
  sec = Math.round(Number(sec));
  if(!isFinite(sec) || isNaN(sec)) return;
  sec = Math.max(30, Math.min(7200, sec));
  goalSec = sec;
  $('goalVal').textContent = sec;
  $('goalMin').value = +(sec/60).toFixed(2);
  $('goal').value = Math.min(600, Math.max(30, sec));
  document.querySelectorAll('.chip').forEach(b=> b.classList.toggle('on', +b.dataset.min*60===sec));
  if(!silent){ saveSet(); render(); }
}
$('goal').oninput = e=> setGoal(e.target.value);
$('goalMin').oninput = e=>{ const v=parseFloat(e.target.value); if(isFinite(v) && v>0) setGoal(v*60); };
$('goalMin').onblur = ()=>{ const v=parseFloat($('goalMin').value); setGoal(isFinite(v)&&v>0 ? v*60 : goalSec); };
document.querySelectorAll('.chip').forEach(b=> b.addEventListener('click', ()=> setGoal(+b.dataset.min*60)));
$('bonus').oninput = e=>{ bonusCoins=+e.target.value; $('bonusVal').textContent=bonusCoins; saveSet(); };
function saveSet(){ store.set('zaoduSet',{threshold,gain:gainMul,goal:goalSec,bonus:bonusCoins}); }
setGoal(goalSec, true);

$('resetBtn').onclick = ()=>{ if(confirm('确定清空所有金币和记录吗？')){ data={days:{},coins:0,streak:0}; energySec=0; session=[]; store.set('zaoduCoin',data); render(); drawChart(); } };

/* 商店 */
function renderShop(){
  $('shopBalance').textContent=data.coins;
  const list=$('shopList'); list.innerHTML='';
  if(!rewards.length) list.innerHTML='<div style="text-align:center;opacity:.6;font-size:13px;padding:12px">还没有奖励，让家长添加吧～</div>';
  rewards.forEach((r,i)=>{
    const el=document.createElement('div'); el.className='shop-item';
    el.innerHTML=`<span class="si-name">${r.name}</span><span class="si-cost">${r.cost} 🪙</span>`;
    const buy=document.createElement('button'); buy.textContent='兑换';
    buy.disabled = data.coins < r.cost;
    buy.onclick=()=>{
      if(data.coins<r.cost) return;
      data.coins-=r.cost; store.set('zaoduCoin',data);
      bumpBank(); vibrate([80,60,80]);
      $('praise').textContent=`🎁 兑换成功：「${r.name}」！找爸爸妈妈兑现吧～`;
      coinRain(15);
      render(); renderShop();
    };
    const del=document.createElement('button'); del.textContent='✕'; del.className='del';
    del.onclick=()=>{ rewards.splice(i,1); store.set('zaoduShop',rewards); renderShop(); };
    el.appendChild(buy); el.appendChild(del); list.appendChild(el);
  });
}
$('addReward').onclick = ()=>{
  const n=$('newName').value.trim(), c=parseInt($('newCost').value);
  if(!n||!c||c<1){ alert('请填写奖励名称和金币数'); return; }
  rewards.push({name:n,cost:c}); store.set('zaoduShop',rewards);
  $('newName').value=''; $('newCost').value='';
  renderShop();
};

const PRAISES=['叮！金币到账！💰','读得响亮，金币哗哗掉！🪙','哇！这波爆率高！✨','金嗓子值千金！🥇','继续读，存钱罐要满啦！🏦','声音洪亮 = 财大气粗！😆'];
let lastPraise=0;
function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }
function ding(){ // 金币音效
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='square'; o.frequency.setValueAtTime(988,audioCtx.currentTime);
  o.frequency.setValueAtTime(1319,audioCtx.currentTime+0.08);
  g.gain.setValueAtTime(0.08,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.25);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.25);
}

function loop(){
  if(!running || !analyser){ looping=false; return; }
  looping=true;
  const buf=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(buf);
  let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
  const rms=Math.sqrt(sum/buf.length);
  let db = Math.round(rms>0? 20*Math.log10(rms)*gainMul + 94 - 20*Math.log10(gainMul*0.05) : 0);
  db = Math.max(0, Math.min(110, db));

  $('dbVal').textContent=db;
  pushSample(db);
  const t=data.days[todayKey()]||{};
  if(db>t.peak){ t.peak=db; data.days[todayKey()]=t; store.set('zaoduCoin',data); }

  above = db>=threshold;
  const ratio=Math.min(1, db/100);
  const size=1+ratio*0.25, hue=40+ratio*30;
  ['ring1','ring2','ring3'].forEach((id,i)=>{
    const el=$(id);
    el.style.transform=`scale(${size - i*0.04})`;
    el.style.borderColor=`hsl(${above?hue:210},90%,${55+i*8}%)`;
    el.style.boxShadow = above? `0 0 ${30*ratio}px hsla(${hue},95%,60%,.7)` : 'none';
  });
  $('status').textContent = above? '💰 超级洪亮！金币在掉！' : db>=threshold-12? '再大声一点点就爆金币了！' : '太小声啦，大点声才有金币哦～';
  if(above && Date.now()-lastPraise>6000){ $('praise').textContent=PRAISES[Math.floor(Math.random()*PRAISES.length)]; lastPraise=Date.now(); }

  if(above){ energyAcc += 0.1; if(energyAcc>=1){ energyAcc=0; addEnergySecond(); } } else energyAcc=0;
  render();
  drawFx(ratio, above);
  requestAnimationFrame(loop);
}
let energyAcc=0, above=false, energySec=0;
function addEnergySecond(){
  const t=data.days[todayKey()]||{peak:0};
  if(t.done) return;
  energySec++;
  store.set('zaoduCoin',data);
  if(energySec%10===0){
    data.coins++; t.coins=(t.coins||0)+1; store.set('zaoduCoin',data);
    popCoin(1); bumpBank(); ding(); vibrate(30);
  }
  if(energySec>=goalSec){
    t.done=1; data.days[todayKey()]=t;
    data.coins += bonusCoins; t.coins=(t.coins||0)+bonusCoins;
    const y=new Date(); y.setDate(y.getDate()-1);
    const yk=y.toISOString().slice(0,10);
    data.streak = (data.days[yk]&&data.days[yk].done)? data.streak+1 : 1;
    store.set('zaoduCoin',data);
    coinRain(bonusCoins); bumpBank(); ding(); ding(); vibrate([100,80,100,80,200]);
    $('praise').textContent=`🏆 今日任务完成！大奖 ${bonusCoins} 枚金币爆进存钱罐！`;
    render();
  }
}
function bumpBank(){ const b=$('bank'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }

/* ===== 声音折线图（本次朗读全程） ===== */
const cc=$('dbChart'), cctx=cc.getContext('2d');
const SAMPLE_MS=200, MAX_MS=10*60*1000;   // 每 200ms 采一个点，最多保留 10 分钟
let session=[], lastSample=0;
function pushSample(db){
  const now=Date.now();
  if(now-lastSample<SAMPLE_MS) return;
  lastSample=now;
  session.push({t:now, db});
  while(session.length>2 && now-session[0].t>MAX_MS) session.shift();
  drawChart();
}
function sessionStats(){
  if(!session.length) return null;
  let sum=0,min=999,max=-999,above=0;
  for(const s of session){ sum+=s.db; if(s.db<min)min=s.db; if(s.db>max)max=s.db; if(s.db>=threshold)above++; }
  return {avg:sum/session.length, min, max, above, n:session.length, t0:session[0].t, t1:session[session.length-1].t};
}
function drawChart(){
  const dpr=window.devicePixelRatio||1;
  const w=cc.offsetWidth||300, h=cc.offsetHeight||88;
  if(cc.width!==Math.round(w*dpr)||cc.height!==Math.round(h*dpr)){ cc.width=Math.round(w*dpr); cc.height=Math.round(h*dpr); }
  cctx.setTransform(dpr,0,0,dpr,0,0);
  cctx.clearRect(0,0,w,h);
  const st=sessionStats();
  const padL=28, padR=8, padT=10, padB=14;
  const gw=w-padL-padR, gh=h-padT-padB;
  let lo=30, hi=95;
  if(st){
    lo=Math.max(0, Math.floor((st.min-4)/5)*5);
    hi=Math.min(110, Math.ceil((st.max+4)/5)*5);
    if(hi-lo<25) hi=Math.min(110, lo+25);
  }
  const yOf=db=> padT+gh-(db-lo)/(hi-lo)*gh;
  cctx.font='9px sans-serif'; cctx.textBaseline='middle';
  for(let i=0;i<=2;i++){
    const v=lo+(hi-lo)*i/2, y=yOf(v);
    cctx.strokeStyle='rgba(255,255,255,.12)'; cctx.lineWidth=1;
    cctx.beginPath(); cctx.moveTo(padL,y); cctx.lineTo(w-padR,y); cctx.stroke();
    cctx.textAlign='right'; cctx.fillStyle='rgba(255,255,255,.5)'; cctx.fillText(String(Math.round(v)), padL-4, y);
  }
  if(!st){
    cctx.textAlign='center'; cctx.fillStyle='rgba(255,255,255,.45)';
    cctx.fillText('点「开始朗读」，这里会画出你的声音曲线', w/2, h/2+2);
    $('avgText').textContent='平均 -- dB'; $('chartDur').textContent='00:00';
    return;
  }
  const t0=st.t0, t1=Math.max(st.t1, t0+1000);
  if(threshold>=lo && threshold<=hi){
    const y=yOf(threshold);
    cctx.save(); cctx.setLineDash([4,4]); cctx.strokeStyle='rgba(255,130,90,.75)'; cctx.lineWidth=1;
    cctx.beginPath(); cctx.moveTo(padL,y); cctx.lineTo(w-padR,y); cctx.stroke(); cctx.restore();
  }
  const cols=Math.max(2, Math.floor(gw));
  const bMin=new Array(cols).fill(NaN), bMax=new Array(cols).fill(NaN), bSum=new Array(cols).fill(0), bN=new Array(cols).fill(0);
  for(const s of session){
    let c=Math.round((s.t-t0)/(t1-t0)*(cols-1));
    if(c<0)c=0; if(c>=cols)c=cols-1;
    if(isNaN(bMin[c])||s.db<bMin[c]) bMin[c]=s.db;
    if(isNaN(bMax[c])||s.db>bMax[c]) bMax[c]=s.db;
    bSum[c]+=s.db; bN[c]++;
  }
  cctx.fillStyle='rgba(79,172,254,.38)';
  for(let c=0;c<cols;c++){
    if(!bN[c]) continue;
    const y1=yOf(bMax[c]), y2=yOf(bMin[c]);
    cctx.fillRect(padL+c, y1, 1, Math.max(1, y2-y1));
  }
  const grad=cctx.createLinearGradient(0,padT,0,padT+gh);
  grad.addColorStop(0,'#ffd200'); grad.addColorStop(1,'#4facfe');
  cctx.strokeStyle=grad; cctx.lineWidth=1.6; cctx.lineJoin='round'; cctx.beginPath();
  let started=false;
  for(let c=0;c<cols;c++){
    if(!bN[c]) continue;
    const x=padL+c, y=yOf(bSum[c]/bN[c]);
    if(!started){ cctx.moveTo(x,y); started=true; } else cctx.lineTo(x,y);
  }
  cctx.stroke();
  const ay=yOf(st.avg);
  cctx.save(); cctx.setLineDash([6,4]); cctx.strokeStyle='#ffd200'; cctx.lineWidth=1.2;
  cctx.beginPath(); cctx.moveTo(padL,ay); cctx.lineTo(w-padR,ay); cctx.stroke(); cctx.restore();
  cctx.textAlign='left'; cctx.fillStyle='#ffd200'; cctx.font='bold 9px sans-serif';
  cctx.fillText('平均 '+st.avg.toFixed(1), padL+3, Math.max(padT+5, ay-7));
  $('avgText').textContent=`平均 ${st.avg.toFixed(1)} dB · 峰值 ${st.max} · 达标 ${Math.round(st.above/st.n*100)}%`;
  const secs=Math.round((st.t1-st.t0)/1000);
  $('chartDur').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}
window.addEventListener('resize', drawChart);
window.addEventListener('orientationchange', ()=> setTimeout(drawChart, 300));

/* FX */
const pc=$('fx'), pctx=pc.getContext('2d');
let coins=[], sparks=[];
function popCoin(n){ const w=pc.offsetWidth,h=pc.offsetHeight;
  for(let i=0;i<n;i++) coins.push({x:w/2+(Math.random()-0.5)*100,y:h/2,vx:(Math.random()-0.5)*2,vy:-3-Math.random()*3,rot:0,vr:0.15+Math.random()*0.2,life:70,r:12+Math.random()*6});
}
function drawFx(ratio, above){
  const w=pc.width=pc.offsetWidth, h=pc.height=pc.offsetHeight;
  pctx.clearRect(0,0,w,h);
  if(above && Math.random()<ratio*0.6) sparks.push({x:w/2+(Math.random()-0.5)*80,y:h/2,vx:(Math.random()-0.5)*3,vy:-Math.random()*4-1,life:50,c:`hsl(${40+ratio*20},95%,65%)`,r:2+Math.random()*3});
  sparks=sparks.filter(p=>p.life>0);
  sparks.forEach(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--; pctx.globalAlpha=p.life/50; pctx.fillStyle=p.c; pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,7);pctx.fill(); });
  coins=coins.filter(c=>c.life>0);
  coins.forEach(c=>{
    c.x+=c.vx;c.y+=c.vy;c.vy+=0.08;c.rot+=c.vr;c.life--;
    const squish=Math.abs(Math.cos(c.rot));
    pctx.globalAlpha=Math.min(1,c.life/30);
    pctx.fillStyle='#ffd200'; pctx.strokeStyle='#b8860b'; pctx.lineWidth=2;
    pctx.beginPath(); pctx.ellipse(c.x,c.y,Math.max(1.5,c.r*squish),c.r,0,0,7); pctx.fill(); pctx.stroke();
    if(squish>0.5){ pctx.fillStyle='#b8860b'; pctx.font=`bold ${c.r}px sans-serif`; pctx.textAlign='center'; pctx.fillText('¥',c.x,c.y+c.r*0.35); }
  });
  pctx.globalAlpha=1;
}

/* 金币雨 */
const rc=$('rain'), rctx=rc.getContext('2d');
function coinRain(n){
  rc.width=innerWidth; rc.height=innerHeight;
  let rs=[]; for(let i=0;i<Math.min(n*3,120);i++) rs.push({x:Math.random()*rc.width,y:-30-Math.random()*400,vx:(Math.random()-0.5)*1.5,vy:3+Math.random()*4,rot:Math.random()*7,vr:0.1+Math.random()*0.25,r:10+Math.random()*10});
  let frames=0;
  (function tick(){
    rctx.clearRect(0,0,rc.width,rc.height);
    rs.forEach(c=>{
      c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;
      const squish=Math.abs(Math.cos(c.rot));
      rctx.fillStyle='#ffd200'; rctx.strokeStyle='#b8860b'; rctx.lineWidth=2;
      rctx.beginPath(); rctx.ellipse(c.x,c.y,Math.max(1.5,c.r*squish),c.r,0,0,7); rctx.fill(); rctx.stroke();
    });
    if(++frames<300) requestAnimationFrame(tick); else rctx.clearRect(0,0,rc.width,rc.height);
  })();
}

/* 页面切到后台自动暂停，防止能量空涨 */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && running) stop(); });

render();
drawChart();
